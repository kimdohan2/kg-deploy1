<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Studio — Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Mrs+Saint+Delafield&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-story">

  <header class="PageHead">
    <h1 class="PageTitle" id="StoryTitle"></h1>
    <p class="PageSubtitle">From the very first sketch until today</p>
  </header>

  <div class="Graphic">
    <img class="desk" src="assets/img/story-desk.webp" alt="" onerror="this.remove()">
    <img class="person" src="assets/img/story-person.webp" alt="" onerror="this.remove()">
    <img class="papers" src="assets/img/story-papers.webp" alt="" onerror="this.remove()">
  </div>

  <div class="Story">
    <nav class="StoryNav mono"><span class="progress"><i></i></span></nav>
    <div class="StorySections"></div>
  </div>

  <footer class="Footer">
    <div class="sig"></div>
    <p class="mono">Let's make something together — hello@yourstudio.com</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/story.js"></script>
</body>
</html>
