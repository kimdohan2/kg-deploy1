<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Studio — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Mrs+Saint+Delafield&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-home">

  <!-- 인트로 게이트 -->
  <div id="Intro">
    <div class="top"><div class="sig"></div><div class="hint">Turn on your sound</div></div>
    <div class="big"></div>
    <p class="copy"></p>
    <button class="enter">Enter</button>
    <div class="seq">
      <span data-orn="[1]">Listen.</span>
      <span data-orn="[0, 5]">Imagine.</span>
      <span data-orn="[2]">Create.</span>
    </div>
    <button class="SoundBtn sound" aria-label="Sound"><i></i><i></i><i></i><i></i></button>
    <button class="skip">Skip</button>
  </div>

  <main id="Home">
    <div class="Works"><div class="Works-track"></div></div>

    <div class="Titles">
      <span class="sub mono"></span>
      <div class="stack"></div>
      <span class="label"></span>
    </div>

    <div class="Single">
      <button class="Single-nav prev"><span class="t"></span><span class="arrow"></span></button>
      <div class="Single-slices"></div>
      <button class="Single-nav next"><span class="t"></span><span class="arrow"></span></button>
    </div>
  </main>

  <div class="Controls">
    <div class="left">
      <button class="SoundBtn" aria-label="Sound"><i></i><i></i><i></i><i></i></button>
      <a href="#all" class="SeeAll mono"></a>
    </div>
    <div class="ModeToggle">
      <button data-mode="single" aria-label="Single view"><span class="ic-single"></span></button>
      <button data-mode="strips" class="active" aria-label="Strip view"><span class="ic-strips"><i></i><i></i><i></i></span></button>
    </div>
    <div class="Spacer"></div>
  </div>

  <section class="AllWorks">
    <button class="close mono">Close ✕</button>
    <h2>All Works</h2>
    <div class="AllWorks-grid"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
